
name: DotNet CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build and Test .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MySolution.sln

      - name: Build
        run: dotnet build MySolution.sln -c Release --no-restore

      - name: Test
        run: dotnet test MySolution.sln -c Release --no-build

      - name: Publish
        run: dotnet publish src/MyApi/MyApi.csproj -c Release -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package
          path: ./publish/
